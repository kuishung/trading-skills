# IBC config for guns-bot — generated by setup_ibkr.py
# https://github.com/IbcAlpha/IBC/blob/master/userguide.md
# Credentials are NOT stored here — see StartIBC-guns.bat which sources them
# from D:\Dropbox\VAULT\Claude Credential\credentials.txt at runtime and passes them to IBC via env vars.

IbLoginId=
IbPassword=
TradingMode=paper
IbDir=
FIX=no

# Gateway, not full TWS. IbcPath/IbcIniPath are passed at runtime by
# StartIBC-guns.bat (via %~dp0) so this file stays path-portable.
IbcPath=
IbcIniPath=
TwsPath=C:\Jts\ibgateway\1045
TwsSettingsPath=

# Auto-close Gateway dialogs we don't want appearing
# primary = Hermes wins if laptop TWS tries to grab the session. The
# alternative ('manual') pops a dialog requiring human confirmation —
# would pause the ingest for hours. 'primary' is correct for the
# dedicated ingest box; laptop must close TWS during Hermes runs.
ExistingSessionDetectedAction=primary
AcceptIncomingConnectionAction=accept
ShowAllTrades=no
MinimizeMainWindow=yes
ReadOnlyLogin=no
ReadOnlyApi=yes
StoreSettingsOnServer=no

# Keep Gateway alive through IBKR's daily server reset (~23:45 ET).
# Default is IbAutoClosedown=yes which closes Gateway at the reset
# time and waits for a manual restart — would interrupt overnight
# ingest runs. Set 'no' so IBC silently dismisses the closedown
# dialog and the session re-authenticates in place.
IbAutoClosedown=no

# Daily restart — handled by Windows Task Scheduler, not IBC
AutoRestartTime=
AutoLogoffTime=
ClosedownAt=
