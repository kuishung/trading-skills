<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="TradeHunter">
  <!-- hunter: crosshair ring -->
  <circle cx="16" cy="16" r="10.5" stroke="#10b981" stroke-width="2"/>
  <!-- crosshair ticks -->
  <path d="M16 1 V4.5 M16 27.5 V31 M1 16 H4.5 M27.5 16 H31"
        stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- trade: rising trend line -->
  <path d="M9.5 20.5 L13 17 L16 19 L23 10.5"
        stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead -->
  <path d="M23 10.5 H19 M23 10.5 V14.5"
        stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
