{% extends "base.html" %}
{% block title %}{{ title }} · TradeHunter{% endblock %}
{% block content %}
<div class="max-w-3xl">
  <h1 class="text-2xl font-semibold mb-1">{{ title }}</h1>
  <div class="mt-4 rounded-lg border border-slate-800 bg-slate-900/40 p-6">
    <div class="flex items-center gap-2 text-sm text-amber-300/90 mb-2">
      <span class="text-[10px] uppercase px-1.5 py-0.5 rounded border border-amber-500/40">under construction</span>
    </div>
    <p class="text-sm text-slate-400 leading-relaxed">{{ blurb }}</p>
  </div>
</div>
{% endblock %}
