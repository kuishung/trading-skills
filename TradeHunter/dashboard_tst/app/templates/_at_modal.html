{# Pop-out modal shell for analyst targets (loaded by HTMX). Include once per page.
   Trigger with a button: hx-get="/matp/<SYM>/targets" hx-target="#atModalBody" onclick="atOpen()" #}
<div id="atModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
     onclick="if (event.target === this) atClose()">
  <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-w-3xl w-full max-h-[85vh] overflow-y-auto">
    <div id="atModalBody" class="p-5"><div class="text-slate-500 text-sm">Loading&hellip;</div></div>
  </div>
</div>
<script>
  function atOpen() { document.getElementById('atModal').classList.remove('hidden'); }
  function atClose() { document.getElementById('atModal').classList.add('hidden'); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') atClose(); });
</script>
