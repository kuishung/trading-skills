{# Sector Rotation (v4.257): the collapse button of a card - set `_fold` to the card's key before including.
   It hides / shows the element with id "scFold-<key>"; the choice is kept per browser. #}
<button type="button" class="sc-fold ml-2 inline-flex items-center justify-center w-6 h-6 rounded border border-slate-700 text-slate-400 hover:text-slate-200"
        data-fold="{{ _fold }}" title="Collapse" aria-label="Collapse" aria-expanded="true">
  <svg class="sc-fold-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
</button>
