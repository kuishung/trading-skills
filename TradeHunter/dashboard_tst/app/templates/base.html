<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TradeHunter &middot; trade collaboration{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body {
      background-color: #020617;
      background-image:
        radial-gradient(60rem 42rem at 50% -10%, rgba(16,185,129,0.22), transparent 62%),
        radial-gradient(45rem 30rem at 92% 2%, rgba(56,189,248,0.12), transparent 68%),
        linear-gradient(rgba(148,163,184,0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,0.09) 1px, transparent 1px),
        linear-gradient(180deg, #0c1424 0%, #020617 55%);
      background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px, 100% 100%;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/70 backdrop-blur px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 font-semibold tracking-wide">
      <img src="/static/logo.svg" alt="" class="h-7 w-7">
      <span>TradeHunter <span class="text-slate-500 font-normal text-sm">&middot; trade collaboration</span></span>
    </a>
    <nav class="text-sm flex gap-4 items-center">
      {% if user %}
        <a href="/studies" class="hover:text-emerald-400">Studies</a>
        <a href="/finviz" class="hover:text-emerald-400">Finviz</a>
        <a href="/feedback" class="hover:text-emerald-400">Feedback</a>
        {% if user.is_admin %}<a href="/admin" class="hover:text-emerald-400">Admin</a>{% endif %}
        <span class="text-slate-400">{{ user.display_name }}</span>
        <form method="post" action="/logout" class="inline">
          <button class="text-slate-400 hover:text-rose-400">Logout</button>
        </form>
      {% else %}
        <a href="/login" class="hover:text-emerald-400">Login</a>
      {% endif %}
    </nav>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
