{% extends "base.html" %}
{% block title %}Sign in &middot; TST{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto text-center">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>
  {% if error %}<p class="text-rose-400 text-sm mb-3">{{ error }}</p>{% endif %}
  <a href="/login"
     class="inline-flex items-center gap-2 rounded bg-white text-slate-800 hover:bg-slate-100 px-4 py-2 font-medium">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.4 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/>
      <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.2-8.8 2.2-6.3 0-11.6-3.9-13.5-9.4l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
    </svg>
    Sign in with Google
  </a>
  <p class="text-xs text-slate-500 mt-4">
    New accounts require admin approval before access is granted.
  </p>
</div>
{% endblock %}
