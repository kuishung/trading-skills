# Alembic config for the Options Screener's OWN database (OPTIONS_SCREENER_DESIGN.md §2-§3).
# A second environment beside alembic.ini (the platform DB): its scripts live in
# alembic_screener/ and its history in the table alembic_version_screener, so on Postgres
# both histories can share one database.
# The DB URL is NOT set here - app/screener_db.py sets sqlalchemy.url (from
# TST_SCREENER_DATABASE_URL, default screener.db beside tst.db) before every run, and
# alembic_screener/env.py falls back to screener_db.database_url().
# No logging sections on purpose: env.py does not call fileConfig, so running these
# migrations at web-app startup or in the collector never resets their log handlers.
[alembic]
script_location = alembic_screener
prepend_sys_path = .
