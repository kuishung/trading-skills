# IBC config for guns-bot — generated by setup_ibkr.py
# https://github.com/IbcAlpha/IBC/blob/master/userguide.md
# Credentials are NOT stored here — see StartIBC-guns.bat which sources them
# from D:\Dropbox\VAULT\Claude Credential\credentials.txt at runtime and passes them to IBC via env vars.

IbLoginId=
IbPassword=
TradingMode=paper
IbDir=
FIX=no

# Gateway, not full TWS. IbcPath/IbcIniPath are passed at runtime by
# StartIBC-guns.bat (via %~dp0) so this file stays path-portable.
IbcPath=
IbcIniPath=
TwsPath=C:\Jts\ibgateway\1045
TwsSettingsPath=

# Auto-close Gateway dialogs we don't want appearing
ExistingSessionDetectedAction=manual
AcceptIncomingConnectionAction=accept
ShowAllTrades=no
MinimizeMainWindow=yes
ReadOnlyLogin=no
ReadOnlyApi=yes
StoreSettingsOnServer=no

# Daily restart — handled by Windows Task Scheduler, not IBC
AutoRestartTime=
AutoLogoffTime=
ClosedownAt=
